name: Update Strava API Secret

on:
  workflow_dispatch:  # Allows manual trigger in GitHub Actions
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight (adjust as needed)

jobs:
  update-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install @aws-sdk/client-secrets-manager

      - name: Store Strava API Token in AWS Secrets Manager
        env:
          AWS_REGION: "us-east-1"
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }} # GitHub Secret
        run: |
          node -e "
          const { SecretsManagerClient, PutSecretValueCommand } = require('@aws-sdk/client-secrets-manager');
          const client = new SecretsManagerClient({ region: process.env.AWS_REGION });
          (async () => {
            try {
              await client.send(new PutSecretValueCommand({
                SecretId: 'StravaAPIToken',
                SecretString: JSON.stringify({ access_token: process.env.STRAVA_ACCESS_TOKEN })
              }));
              console.log('✅ Strava API token updated successfully');
            } catch (error) {
              console.error('❌ Error updating secret:', error);
              process.exit(1);
            }
          })();
          "

      - name: Success Message
        run: echo "✅ Strava API token updated successfully!"
